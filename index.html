<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up Form Odin</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="left-side">
        <div class="card-container">
            <img class="odin-logo" src="odin-lined.png" alt="odin-logo">
            <p>Odin</p>
        </div>
        <div class="ref">
        <p>Foto de <a
                href="https://unsplash.com/es/@nicknice?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Nick
                Nice</a> en <a
                href="https://unsplash.com/es/fotos/un-controlador-azul-sentado-encima-de-una-pila-de-rocas-l7lTd1OBkp0?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Unsplash</a>
        </p>
        </div>
    </div>
    <main class="right-side">
        <div class="signup-content">
            <p>This isn’t a real service, but every great gamer needs to get ready for their next adventure. Sign up now and
                let the game begin!</p>
            <form action="#" method="post" class="form">
                <h2 class="form__heading">Let's do this!</h2>
                <div class="row">
                    <div class="input-element">
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="input-element">
                        <label for="last-name">Last Name:</label>
                        <input type="text" id="last-name" name="last-name" required>
                    </div>
                </div>
            </form>
        </div>
    
    </main>
    </body>
    
    </html>
