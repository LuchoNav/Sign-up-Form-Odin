<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up Form Odin</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="left-side">
        <div class="card-container">
            <img class="odin-logo" src="odin-lined.png" alt="odin-logo">
            <p>Odin</p>
        </div>
        <div class="ref">
            <p>Foto de <a href="https://unsplash.com/es/@nicknice?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText" target="_blank" rel="noopener noreferrer">Nick Nice</a> en <a href="https://unsplash.com/es/fotos/un-controlador-azul-sentado-encima-de-una-pila-de-rocas-l7lTd1OBkp0?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText" target="_blank" rel="noopener noreferrer">Unsplash</a></p>
        </div>
    </div>
    <main class="right-side">
        <div class="text">
            <p>This isn’t a real service, but every great gamer needs to get ready for their next adventure. Sign up now
                and
                let the game begin!</p>
        </div>
        <div class="signup-content">
            <form action="#" method="post" class="form" id="gamer-form">
                <h2 class="form__heading">Let's do this!</h2>
                <div class="row">
                    <div class="input-element">
                        <label for="name">FIRST NAME</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="input-element">
                        <label for="last-name">LAST NAME</label>
                        <input type="text" id="last-name" name="last-name" required>
                    </div>
                </div>
                <div class="row">
                    <div class="input-element">
                        <label for="email">EMAIL</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="input-element">
                        <label for="number">PHONE NUMBER</label>
                        <input type="tel" id="number" name="number" required>
                    </div>
                </div>
                <div class="row">
                    <div class="input-element">
                        <label for="password">PASSWORD</label>
                        <input type="password" id="password" name="password" minlength="8" required>
                    </div>
                    <div class="input-element">
                        <label for="confirm-password">CONFIRM PASSWORD</label>
                        <input type="password" id="confirm-password" name="confirm-password" minlength="8" required>
                    </div>
                </div>
            </form>
        </div>

            <div class="form-action">
                <button type="submit" form="gamer-form">Create Account</button>
            </div>

    </main>
</body>

</html>
